<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Página no encontrada | SantOps</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(ellipse at 50% 0%, rgba(6, 182, 212, 0.15) 0%, transparent 70%), #07090e;
        }
        .error-container {
            background: rgba(13, 19, 32, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3.5rem 2.5rem;
            max-width: 600px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(6, 182, 212, 0.12);
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #f8fafc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1;
            filter: drop-shadow(0 0 30px rgba(6, 182, 212, 0.3));
        }
        .error-title {
            font-size: 2rem;
            font-weight: 700;
            color: #f8fafc;
            margin: 1.5rem 0 1rem;
        }
        .error-message {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.35);
        }
        .error-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(6, 182, 212, 0.5);
        }
        .error-btn.secondary {
            background: rgba(13, 19, 32, 0.8);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }
        .error-btn.secondary:hover {
            border-color: #38bdf8;
            color: #38bdf8;
            background: rgba(22, 34, 54, 0.95);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-container">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Página no encontrada</h2>
            <p class="error-message">
                Lo sentimos, la página que buscas no existe o fue movida.
                Pero no te preocupes, podemos ayudarte a encontrar lo que necesitas.
            </p>
            <div class="error-links">
                <a href="index.html" class="error-btn">Volver al inicio</a>
                <a href="contacto.html" class="error-btn secondary">Contacto</a>
            </div>
        </div>
    </div>
</body>
</html>
